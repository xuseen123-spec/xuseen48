<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact | My Website</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- ==============================
         LOADING SCREEN
    =============================== -->

    <div id="loadingScreen">

        <div class="loader"></div>

        <p>Loading...</p>

    </div>



    <!-- ==============================
         NAVBAR
    =============================== -->

    <header class="navbar">

        <div class="logo">
            MyWebsite
        </div>


        <!-- Mobile Menu Button -->

        <div
            class="menu-toggle"
            id="menuToggle"
        >
            ☰
        </div>


        <!-- Navigation -->

        <nav
            class="main-nav"
            id="mainNav"
        >

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>


        <!-- Dark Mode -->

        <button
            class="theme-toggle"
            id="themeToggle"
        >
            🌙 Dark Mode
        </button>

    </header>



    <!-- ==============================
         CONTACT SECTION
    =============================== -->

    <main>

        <section class="contact-section">

            <div class="contact-container">


                <!-- CONTACT INFORMATION -->

                <div class="contact-info">

                    <h1>
                        Contact Us
                    </h1>

                    <p>
                        Have a question or need help?
                        Send us a message and we will
                        get back to you.
                    </p>


                    <div class="contact-card">

                        <h3>
                            Email
                        </h3>

                        <p>
                            example@email.com
                        </p>

                    </div>


                    <div class="contact-card">

                        <h3>
                            Phone
                        </h3>

                        <p>
                            +252 61 0000000
                        </p>

                    </div>


                    <div class="contact-card">

                        <h3>
                            Location
                        </h3>

                        <p>
                            Mogadishu, Somalia
                        </p>

                    </div>

                </div>



                <!-- CONTACT FORM -->

                <div class="contact-form-container">

                    <h2>
                        Send Us a Message
                    </h2>


                    <form
                        class="contact-form"
                        id="contactForm"
                        action="#"
                        method="post"
                    >


                        <!-- Full Name -->

                        <div class="form-group">

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Your Full Name"
                                required
                            >

                        </div>



                        <!-- Email -->

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Your Email"
                                required
                            >

                        </div>



                        <!-- Phone -->

                        <div class="form-group">

                            <label for="phone">
                                Phone
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Your Phone"
                            >

                        </div>



                        <!-- Country -->

                        <div class="form-group">

                            <label for="country">
                                Country
                            </label>

                            <select
                                id="country"
                                name="country"
                            >

                                <option value="">
                                    Select your country
                                </option>

                                <option value="Somalia">
                                    Somalia
                                </option>

                                <option value="Kenya">
                                    Kenya
                                </option>

                                <option value="Ethiopia">
                                    Ethiopia
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- Service -->

                        <div class="form-group">

                            <label for="service">
                                Service
                            </label>

                            <select
                                id="service"
                                name="service"
                            >

                                <option value="">
                                    Select a service
                                </option>

                                <option value="Web Development">
                                    Web Development
                                </option>

                                <option value="Graphic Design">
                                    Graphic Design
                                </option>

                                <option value="Video Editing">
                                    Video Editing
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- Message -->

                        <div class="form-group">

                            <label for="message">
                                Your Message
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                placeholder="Your Message"
                                rows="6"
                                required
                            ></textarea>

                        </div>



                        <!-- Checkbox -->

                        <div class="form-checkbox">

                            <input
                                type="checkbox"
                                id="agreement"
                                name="agreement"
                                required
                            >

                            <label for="agreement">
                                I agree to be contacted.
                            </label>

                        </div>



                        <!-- Submit -->

                        <button
                            type="submit"
                            class="submit-button"
                        >
                            Send Message
                        </button>

                    </form>



                    <!-- ERROR MESSAGE -->

                    <div
                        id="errorMessage"
                        class="error-message"
                    ></div>



                    <!-- SUCCESS MESSAGE -->

                    <div
                        id="formMessage"
                        class="form-message"
                    ></div>

                </div>

            </div>

        </section>

    </main>



    <!-- ==============================
         FOOTER
    =============================== -->

    <footer class="site-footer">

        <p>
            © 2026 MyWebsite. All rights reserved.
        </p>

    </footer>



    <!-- ==============================
         BACK TO TOP
    =============================== -->

    <button
        id="backToTop"
        title="Go to top"
    >
        ↑
    </button>



    <!-- ==============================
         TOAST
    =============================== -->

    <div id="toast"></div>



    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="js/script.js"></script>

</body>

</html>
